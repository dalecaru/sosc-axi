name: Require no-mistakes
run-name: "PR #${{ github.event.pull_request.number }} body compliance - ${{ github.event.action }} - event ${{ github.run_number }} (run ${{ github.run_id }})"

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main
    # Skip release-please PRs entirely: a GITHUB_TOKEN PR's run is created in
    # action_required and never starts, so the job-level exemption can't help.
    paths-ignore:
      - .release-please-manifest.json
      - CHANGELOG.md
      - package.json

permissions:
  contents: read
  pull-requests: read

# Per-event group for opened/edited so pending body checks never collapse;
# head changes coalesce.
concurrency:
  group: no-mistakes-required-${{ github.event.pull_request.number }}-${{ (github.event.action == 'opened' || github.event.action == 'edited') && github.run_id || 'head-change' }}
  cancel-in-progress: true

jobs:
  check:
    name: PR must be raised via no-mistakes
    runs-on: ubuntu-latest
    # Automation accounts (release-please, dependabot, sync-openapi) are exempt;
    # everyone else must raise PRs through `git push no-mistakes`.
    if: >-
      github.event.pull_request.user.login != 'github-actions[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'release-please[bot]'
    steps:
      # Pinned to a commit, never @main: bump the pin in a separate PR.
      - name: Verify no-mistakes signature and pipeline attestation in PR body
        uses: kunchenguid/no-mistakes/.github/actions/require-no-mistakes@f6441c96c352a18b9cadcaef6b6c7017e9ac3970 # v1.80.1
