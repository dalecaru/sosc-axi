name: guard-generated-files

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # release-please owns CHANGELOG.md and the manifest; its PR is the one legitimate place they change
    if: github.event.pull_request.user.login != 'github-actions[bot]' && github.event.pull_request.user.login != 'release-please[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -qxE 'CHANGELOG\.md|\.release-please-manifest\.json'; then
            echo "::error::CHANGELOG.md and .release-please-manifest.json are generated by release-please from Conventional Commits. Do not edit them by hand."
            exit 1
          fi
