name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm trusted publishing + provenance

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release

      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created }}
      - uses: oven-sh/setup-bun@v2
        if: ${{ steps.release.outputs.release_created }}
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        if: ${{ steps.release.outputs.release_created }}
        with:
          node-version: 24
      - run: npm install -g npm@latest # trusted publishing needs npm >= 11.5.1
        if: ${{ steps.release.outputs.release_created }}
      - run: bun install --frozen-lockfile && bun test && bun run build
        if: ${{ steps.release.outputs.release_created }}
      # 1.2.3-alpha.4 -> dist-tag "alpha", 1.2.3-rc.1 -> "rc", 1.2.3 -> "latest"
      - run: |
          TAG=$(node -p "(require('./package.json').version.match(/-([a-z]+)/) || [, 'latest'])[1]")
          npm publish --provenance --access public --tag "$TAG"
        if: ${{ steps.release.outputs.release_created }}
