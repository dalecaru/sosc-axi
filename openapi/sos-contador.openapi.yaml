            type: string
      responses: 
        "200": 
          description: OK
  "/pago/listado/{periodo}": 
    get: 
      tags: 
        - pago
      summary: pago/listado
      description: Lista las compras de una CUIT determinada.
      operationId: get_pago_listado
      security: 
        - cuitJwt: 
            []
      parameters: 
        - name: periodo
          in: path
          required: true
          description: "Período de consulta [hoy|ayer|semana|mes|mes anterior]"
