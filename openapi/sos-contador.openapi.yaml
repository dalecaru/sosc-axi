  "/iva/listado/{ejercicio}": 
    get: 
      tags: 
        - iva
      summary: iva/listado
      description: Recordsets de F2002 - IVA por Actividad
      operationId: get_iva_listado
      security: 
        - cuitJwt: 
            []
      parameters: 
        - name: ejercicio
          in: path
          required: true
          description: año del ejercicio en formato AAAA
          schema: 
            type: string
          example: "2024"
        - name: anio
          in: query
          description: año en formato AAAA (dentro del ejercicio)
          schema: 
            type: string
        - name: mes
          in: query
          description: mes en formato MM
          schema: 
            type: string
      responses: 
        "200": 
          description: OK
