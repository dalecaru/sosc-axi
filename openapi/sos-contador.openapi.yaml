  "/pago/{id}": 
    put: 
      tags: 
        - pago
      summary: pago
      description: Enviar una compra al sistema.
      operationId: put_pago
      security: 
        - cuitJwt: 
            []
      parameters: 
        - name: id
          in: path
          required: true
          description: Identificador del comprobante de pago (opcional)
          schema: 
            type: string
      requestBody: 
        content: 
          application/json: 
            example: 
              fecha: 2021-01-01
              idclipro: "1"
              idcuenta: "1"
              idprovinciaiibb: "1"
              idcentrocosto: "1"
              memo: ""
              referencia: "1234"
              imputaciones: 
                - fv: "100.00"
                  cuid: "1"
      responses: 
        "200": 
          description: OK
    delete: 
      tags: 
        - pago
      summary: pago
      description: Eliminar una compra.
      operationId: delete_pago
      security: 
        - cuitJwt: 
            []
      parameters: 
        - name: id
          in: path
          required: true
          description: Identificador del comprobante de pago
          schema: 
            type: string
          example: "266"
      responses: 
        "200": 
          description: OK
